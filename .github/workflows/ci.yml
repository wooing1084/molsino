name: Check and package molsino
on:
  pull_request:
    branches:
      - DEV
    types:
      - closed
jobs:
  check:
    if: github.event.pull_request.merged == true
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
